[project]
name = "genai-summit"
version = "0.1.0"
description = "GENAI Summit Hackathon Starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "firecrawl-py>=1.0.0",
    "icalendar>=7.3.0",
    "recurring-ical-events>=3.8.2",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
